<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0px;
        padding: 0px;
        background-color: #1a1a1a;
        color: #fff;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #card {
        width: 20vw;
        background-color: rgba(255, 255, 255, 0.2);
        text-align: center;
        padding: 5px;
        border-radius: 10px;
      }
      #add {
        height: 40px;
        width: 100%;
        border-radius: 20px;
        margin-left: 5px;
        background-color: green;
        color: #fff;
      }
      #quotes {
        list-style-type: none;
        padding: 0px;
        margin: 0px;
      }
      #quotes li {
        border: 1px solid #fff;
        border-radius: 10px;
        padding: 4px;
        margin: 10px 10px 5px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .del {
        background-color: red;
        color: #fff;
        height: 30px;
        border-radius: 15px;
        width: 75px;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <h1>QUOTES</h1>
      <div style="display: flex">
        <button id="add">Get QUOTES</button>
      </div>
      <ul id="quotes">
        <li>
          <strong>Task1</strong>
          <button class="del">Delete</button>
        </li>
      </ul>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
